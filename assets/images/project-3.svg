<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#1e132b" />
    </linearGradient>
    <linearGradient id="cyberPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)" />

  <!-- Cyberpunk UI / HUD Wireframe -->
  <!-- Minimap Radar -->
  <g transform="translate(180, 250)">
    <circle cx="0" cy="0" r="110" fill="#0f172a" stroke="#ec4899" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,4" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#64748b" stroke-width="1" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#334155" stroke-width="1" />
    
    <!-- Radar Sweep Cone -->
    <path d="M 0 0 L 80 -60 A 100 100 0 0 1 100 0 Z" fill="#ec4899" fill-opacity="0.2" />
    <!-- Blips -->
    <circle cx="45" cy="-30" r="5" fill="#f43f5e" />
    <circle cx="-50" cy="40" r="4" fill="#06b6d4" />
    <circle cx="20" cy="60" r="4" fill="#06b6d4" />
  </g>

  <!-- Game HUD Windows -->
  <g transform="translate(360, 140)">
    <!-- Inventory / Skill Tree Wireframe -->
    <rect x="0" y="0" width="380" height="230" rx="8" fill="#111827" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Title bar -->
    <rect x="0" y="0" width="380" height="32" rx="8" fill="#1e293b" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">// INVENTORY &amp; CYBERNETICS UI</text>
    <circle cx="355" cy="16" r="4" fill="#ef4444" />
    
    <!-- Item Grid Slots -->
    <g fill="#1f2937" stroke="#374151" stroke-width="1">
      <rect x="20" y="50" width="50" height="50" rx="6" />
      <rect x="80" y="50" width="50" height="50" rx="6" />
      <rect x="140" y="50" width="50" height="50" rx="6" stroke="#ec4899" stroke-width="1.5" />
      <rect x="20" y="110" width="50" height="50" rx="6" />
      <rect x="80" y="110" width="50" height="50" rx="6" stroke="#06b6d4" stroke-width="1.5" />
      <rect x="140" y="110" width="50" height="50" rx="6" />
    </g>

    <!-- Stat Bars -->
    <text x="210" y="65" fill="#94a3b8" font-family="monospace" font-size="11">STEALTH INDEX</text>
    <rect x="210" y="73" width="150" height="8" rx="4" fill="#334155" />
    <rect x="210" y="73" width="125" height="8" rx="4" fill="#ec4899" />

    <text x="210" y="105" fill="#94a3b8" font-family="monospace" font-size="11">NEURAL SYNC</text>
    <rect x="210" y="113" width="150" height="8" rx="4" fill="#334155" />
    <rect x="210" y="113" width="95" height="8" rx="4" fill="#06b6d4" />

    <!-- Button -->
    <rect x="210" y="145" width="150" height="32" rx="6" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" />
    <text x="245" y="165" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">DEPLOY CHIP</text>
  </g>

  <!-- Tags -->
  <rect x="40" y="40" width="160" height="40" rx="6" fill="#111827" fill-opacity="0.8" stroke="#ec4899" stroke-width="1" />
  <text x="55" y="65" fill="#f472b6" font-family="monospace" font-size="12" font-weight="bold">UI/UX &amp; SYSTEMS</text>

  <rect x="0" y="492" width="800" height="8" fill="url(#cyberPink)" />
</svg>