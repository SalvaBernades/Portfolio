<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="100" fill="url(#avatarBg)" />
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#cyberBorder)" stroke-width="4" stroke-dasharray="8,6" />

  <!-- Stylized Gamepad / Design Icon -->
  <g transform="translate(100, 100) scale(0.9)">
    <!-- Controller Body -->
    <path d="M -45,-15 C -45,-30 -25,-35 0,-35 C 25,-35 45,-30 45,-15 C 45,15 35,45 18,45 C 5,45 0,30 0,30 C 0,30 -5,45 -18,45 C -35,45 -45,15 -45,-15 Z" 
          fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    
    <!-- D-Pad -->
    <rect x="-30" y="-8" width="16" height="6" rx="2" fill="#6366f1" />
    <rect x="-25" y="-13" width="6" height="16" rx="2" fill="#6366f1" />

    <!-- Action Buttons -->
    <circle cx="20" cy="-10" r="3.5" fill="#ec4899" />
    <circle cx="28" cy="-2" r="3.5" fill="#38bdf8" />
    <circle cx="20" cy="6" r="3.5" fill="#10b981" />
    <circle cx="12" cy="-2" r="3.5" fill="#fbbf24" />

    <!-- Center LED -->
    <circle cx="0" cy="-8" r="3" fill="#a855f7" />
  </g>
</svg>