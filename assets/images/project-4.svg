<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329" />
      <stop offset="60%" stop-color="#2a1b3d" />
      <stop offset="100%" stop-color="#3d213b" />
    </linearGradient>
    <linearGradient id="islandSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)" />

  <!-- Warm stylized sun/moon -->
  <circle cx="580" cy="180" r="80" fill="url(#islandSun)" opacity="0.8" />

  <!-- Floating Isometric Islands & Hexagons -->
  <g transform="translate(360, 280)">
    <!-- Main Island Base -->
    <!-- Top Face -->
    <polygon points="0,-80 140,0 0,80 -140,0" fill="#10b981" />
    <polygon points="0,-80 0,0 -140,0" fill="#34d399" opacity="0.5" />
    <!-- Left Bottom -->
    <polygon points="-140,0 0,80 0,160 -140,80" fill="#582f0e" />
    <!-- Right Bottom -->
    <polygon points="0,80 140,0 140,80 0,160" fill="#7f4f24" />
    
    <!-- Island Assets: Trees and Small House -->
    <!-- House -->
    <polygon points="30,-20 60,-5 30,10 0,-5" fill="#f8fafc" />
    <polygon points="0,-5 30,10 30,30 0,15" fill="#cbd5e1" />
    <polygon points="30,10 60,-5 60,15 30,30" fill="#94a3b8" />
    <!-- Roof -->
    <polygon points="30,-40 65,-20 30,-5 -5,-20" fill="#e11d48" />

    <!-- Stylized Low-poly Pine Tree -->
    <polygon points="-50,-20 -30,-20 -40,-60" fill="#047857" />
    <polygon points="-50,-40 -30,-40 -40,-75" fill="#059669" />
    <polygon points="-50,-55 -30,-55 -40,-85" fill="#10b981" />
    <rect x="-42" y="-20" width="4" height="15" fill="#78350f" />
  </g>

  <!-- Small floating companion island -->
  <g transform="translate(160, 230) scale(0.6)">
    <polygon points="0,-70 120,0 0,70 -120,0" fill="#06b6d4" />
    <polygon points="-120,0 0,70 0,130 -120,60" fill="#334155" />
    <polygon points="0,70 120,0 120,60 0,130" fill="#475569" />
    <!-- Crystal -->
    <polygon points="0,-30 15,-10 0,10 -15,-10" fill="#38bdf8" />
    <polygon points="0,-30 0,10 -15,-10" fill="#bae6fd" />
  </g>

  <!-- Economy / Balancing Overlay -->
  <rect x="40" y="40" width="180" height="40" rx="6" fill="#181329" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1" />
  <text x="55" y="65" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">ECONOMY &amp; SIMULATION</text>

  <rect x="0" y="492" width="800" height="8" fill="#f59e0b" />
</svg>